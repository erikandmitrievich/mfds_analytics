name: Track university Repo Traffic
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # --- ADD THIS DEBUG STEP ---
      - name: Debug Raw API Response
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          echo "Asking GitHub for traffic data..."
          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TRAFFIC_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/obluda2173/university/traffic/views
      # ---------------------------

      - name: Repository Traffic
        uses: sangonzal/repository-traffic-action@v.0.1.6
        with:
          repository: obluda2173/university
        env:
          TRAFFIC_ACTION_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update traffic data"
          file_pattern: traffic/*
