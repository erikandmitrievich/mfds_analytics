name: Track University Traffic
on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:      # Allows manual testing

permissions:
  contents: write

jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests pandas

      - name: Fetch and Merge Traffic Data
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          TARGET_REPO: "obluda2173/university" # <--- TARGET IS DEFINED HERE
        run: |
          import os
          import requests
          import pandas as pd
          from datetime import datetime

          # 1. Setup
          REPO = os.environ['TARGET_REPO']
          TOKEN = os.environ['TRAFFIC_TOKEN']
          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github.v3+json"
          }

          if not os.path.exists('traffic'):
              os.makedirs('traffic')

          def update_csv(metric_type, filename):
              print(f"--- Processing {metric_type} ---")

              # 2. Fetch Data from GitHub API
              url = f"https://api.github.com/repos/{REPO}/traffic/{metric_type}"
              response = requests.get(url, headers=HEADERS)

              if response.status_code != 200:
                  print(f"Error fetching data: {response.text}")
                  exit(1)

              data = response.json().get(metric_type, [])

              if not data:
                  print("No data found, skipping.")
                  return

              # 3. Convert to DataFrame
              new_df = pd.DataFrame(data)
              # Ensure we have columns: timestamp, count, uniques
              if 'timestamp' not in new_df.columns:
                  print("Data format unexpected.")
                  return

              new_df['timestamp'] = pd.to_datetime(new_df['timestamp'])

              # 4. Load Existing CSV (History) if it exists
              file_path = f"traffic/{filename}"
              if os.path.exists(file_path):
                  old_df = pd.read_csv(file_path)
                  old_df['timestamp'] = pd.to_datetime(old_df['timestamp'])
                  print(f"Loaded {len(old_df)} existing records.")

                  # 5. Merge and Deduplicate (Keep history)
                  combined = pd.concat([old_df, new_df])
                  # Drop duplicates based on timestamp, keep the newest version
                  combined = combined.drop_duplicates(subset=['timestamp'], keep='last')
                  combined = combined.sort_values(by='timestamp')
              else:
                  combined = new_df
                  print("Created new history file.")

              # 6. Save
              combined.to_csv(file_path, index=False)
              print(f"Saved {len(combined)} records to {filename}")

          # Run for both Views and Clones
          shell_script = """
          """
          update_csv('views', 'views.csv')
          update_csv('clones', 'clones.csv')

        shell: python

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update traffic data"
          file_pattern: traffic/*
